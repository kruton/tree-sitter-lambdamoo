name: Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to set (e.g., 0.2.0). If left empty, "bump" will be used.'
        required: false
        type: string
      bump:
        description: 'Version bump level (used if explicit version is empty)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up tree-sitter CLI
        uses: tree-sitter/setup-action/cli@1868a545ffb91bdc221d14a168b5b6d8de4a28b3 # v2

      - name: Update version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            tree-sitter version "${{ inputs.version }}"
          else
            tree-sitter version --bump "${{ inputs.bump }}"
          fi

      - name: Get updated version
        id: get_version
        run: |
          NEW_VERSION=$(jq -r .version package.json)
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json Cargo.toml Cargo.lock tree-sitter.json
          git commit -m "chore(release): v${{ steps.get_version.outputs.version }}"
          git tag "v${{ steps.get_version.outputs.version }}"
          git push origin HEAD --tags
