[package]
name = "tree-sitter-lambdamoo"
description = "LambdaMOO grammar for the tree-sitter parsing library"
version = "0.2.4"
authors = [
  "Kenny Root <kenny@the-b.org>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "lambdamoo"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/kruton/tree-sitter-lambdamoo"
edition = "2024"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/README.md",
  "/bindings/rust/*",
  "/grammar.js",
  "/queries/*",
  "/src/*",
  "/src/tree_sitter/*",
  "/tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.26.11"
